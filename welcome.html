<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>智绘线云 - 欢迎页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-image"></div>
<div class="welcome-root" style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;">
    <div class="welcome-card" style="background:rgba(26,34,51,0.52);border-radius:24px;box-shadow:0 0 48px #3ecbff88;padding:64px 56px 56px 56px;max-width:700px;width:96vw;text-align:center;">
        <h1 style="color:#3ecbff;font-size:2.8em;letter-spacing:2px;margin-bottom:28px;">智绘线云系统欢迎您！</h1>
        <p style="color:#e0e6f0;font-size:1.18em;margin-bottom:28px;">请将需要处理的las文件拖入下方文件框</p>
        <div id="file-drop-area" style="border:3px dashed #3ecbff;border-radius:18px;background:rgba(135,206,235,0.12);height:220px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:28px;">
            <span id="file-drop-text" style="color:#87ceeb;font-size:1.35em;">拖入或点击选择文件</span>
            <input type="file" id="file-input" accept=".las,.laz" style="opacity:0;position:absolute;left:0;top:0;width:100%;height:100%;cursor:pointer;">
        </div>
        <div style="display:flex;justify-content:center;align-items:center;gap:24px;">
            <button id="start-btn" style="padding:14px 48px;background:#3ecbff;color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:bold;font-size:1.18em;">开始处理</button>
        </div>
        <div id="welcome-tip" style="margin-top:28px;color:#bbb;font-size:1.08em;">未选择文件时，点击“开始处理”会提示请您拖入正确文件。</div>
        <div id="welcome-loading" style="margin-top:28px;color:#3ecbff;font-size:1.25em;display:none;">正在自动分割数据...</div>
    </div>
</div>
<script src="welcome.js"></script>
</body>
</html>
